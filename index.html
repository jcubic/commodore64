    <title>Commodore 64 - jQuery Terminal Demo</title>
    <meta name="Description" content="Demo of look and feel of Commodore 64. Using jQuery Terminal library and some CSS"/>

<style>
/* a fork of https://codepen.io/anthesema/pen/YOJbyG */
:root {
  --background: #3939DE;
  --size: 2;
  --padding: 0;
}

/* fix for jQuery Terminal bug
 * https://github.com/jcubic/jquery.terminal/issues/990
 */
.terminal a:hover {
  --base-background: black;
}

body:before,
.container:before,
.container:after,
.inner-container:after {
  pointer-events: none;
}

.inner-container {
  height: 100%;
}

/* tweak for C64 */
@font-face {
  font-family: "C64 Pro Mono";
  src: url("https://terminal.jcubic.pl//commodore64/fonts/C64_Pro_Mono-STYLE.woff2") format("woff2"), url("https://terminal.jcubic.pl//commodore64/fonts/C64_Pro_Mono-STYLE.woff") format("woff");
  font-weight: normal;
  font-style: normal;
}
#term {
  --font: "C64 Pro Mono";
  margin: 20px;
  height: calc(100% - 40px);
}

.container.container {
  background: #9C9CFF;
}

.container.container:after {
  box-shadow: none;
}

.terminal,
.terminal-output > :not(.raw) span:not(.token),
.terminal-output > :not(.raw) a,
.terminal-output > :not(.raw) div,
.cmd div {
  --font-size: 14px;
  min-height: var(--font-size) !important;
  line-height: var(--font-size);
  line-height: calc(var(--size, 1) * var(--font-size));
}

/* original code below */
body {
  font-family: Sans-serif;
  background: linear-gradient(45deg, #222529 0%, #191519 100%);
}

body:before {
  content: " ";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-style: solid;
  border-width: 72px 72px 72px 72px;
  border-color: rgba(0, 0, 0, 0.4) rgba(0, 0, 0, 0.2) rgba(0, 0, 0, 0) rgba(0, 0, 0, 0.2);
}

.text {
  color: #36ba2c;
  font-size: 24px;
  padding: 0 4px;
  display: inline-block;
  text-shadow: 0px 0px 8px #79ba48;
}

.container {
  background: #222;
  background: radial-gradient(ellipse at center, #2e3d26 0%, #040805 100%);
  background-attachment: fixed;
  position: absolute;
  top: 64px;
  left: 64px;
  right: 64px;
  bottom: 64px;
  padding: 20px;
  border-radius: 24px;
  overflow: hidden;
}

.container:before {
  display: block;
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
}

.container:after {
  display: block;
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 0;
  box-shadow: inset 0px 0px 32px 16px rgba(0, 0, 0, 0.4);
  z-index: 2;
  border-radius: 24px;
}

.inner-container:after {
  position: absolute;
  content: "";
  display: block;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  background: url(https://terminal.jcubic.pl//commodore64/dots.png);
  border-radius: 24px;
}
</style>

    <script src="https://cdn.jsdelivr.net/npm/jquery"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
  </head>
<body>
    <div class="container">
      <div class="inner-container">
        <div id="term"></div>
      </div>
    </div>
    <script>
    // uppercase formatter
    $.terminal.new_formatter([/.+/g, function(x) { return x.toUpperCase(); }]);

    $('#term').terminal($.noop, {
      prompt: '',
      greetings: '     **** COMMODORE 64 BASIC V2 ****\n\n' +
      ' 64K RAM SYSTEM   38911 BASIC BYTES FREE\n\nREADY.'
    });
    </script>
